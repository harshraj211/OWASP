<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RedTeam Hacker Academy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            background: #141b26;
            border: 1px solid #222d3d;
            border-radius: 8px;
            padding: 36px 30px;
            text-align: center;
        }

        .login-logo {
            height: 48px;
            width: auto;
            margin-bottom: 24px;
        }

        .login-header {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #0b0e14;
            border: 1px solid #26334d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #d32f2f;
        }

        .btn-submit {
            width: 100%;
            background: #d32f2f;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background: #b71c1c;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: left;
        }

        .hint-text {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <img src="{{ url_for('static', filename='images/logo.webp') }}" 
             alt="RedTeam Hacker Academy" 
             class="login-logo"
             onError="this.onerror=null; this.src='https://redteamacademy.com/wp-content/uploads/2026/03/RedTeam-Logo-White-min-300x90-1.webp';">

        <div class="login-header">Sign In to Your Account</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="error-msg">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Username" required autofocus>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="hint-text">
            Default credentials: redteamacademy / redteamacademy
        </div>
    </div>

</body>
</html>
