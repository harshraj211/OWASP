{% extends 'layout.html' %}

{% block title %}Home - RedTeam Hacker Academy{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 140px); width: 100%; padding: 20px;">
    <div class="panel" style="text-align: center; padding: 40px 32px; width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; margin: 0 auto;">
        <h1 style="font-size: 28px; font-weight: 700; color: #ffffff; margin-bottom: 8px;">
            Welcome to RedTeam Hacker Academy
        </h1>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 24px;">
            Security Portal & Training Environment
        </p>

        <!-- RedTeam Hacker Academy Campus Image -->
        <div style="width: 100%; max-width: 650px;">
            <img src="{{ url_for('static', filename='images/academy.jpg') }}" 
                 alt="RedTeam Hacker Academy Campus" 
                 style="width: 100%; height: auto; border-radius: 8px; border: 1px solid #26334d; box-shadow: 0 8px 24px rgba(0,0,0,0.5);"
                 onError="this.onerror=null; this.src='https://content3.jdmagicbox.com/v2/comp/mangalore/n1/0824px824.x824.200424214019.i2n1/catalogue/redteam-hacker-academy-milagres-road-mangalore-sgw2oixlfi.jpg';">
        </div>
    </div>
</div>
{% endblock %}
