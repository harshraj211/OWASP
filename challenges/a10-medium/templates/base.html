<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Synapse SCADA Grid{% endblock %} - Telemetry & Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="nav">
        <a href="/" class="brand">
            <span>⚡ Synapse SCADA Regional Grid</span>
        </a>
        <div class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Grid Telemetry</a>
            <a href="/substations" class="{% if request.path == '/substations' %}active{% endif %}">Substation Feeder Bus</a>
            <a href="/grid/telemetry" class="{% if request.path == '/grid/telemetry' %}active{% endif %}">Telemetry Ingestion</a>
            <a href="/system/safety-interlock" class="{% if request.path == '/system/safety-interlock' %}active{% endif %}">Safety Interlock Monitor</a>
            <a href="/core/override" class="{% if request.path == '/core/override' %}active{% endif %}" style="color: var(--yellow); font-weight: 700;">Emergency Core</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        Synapse Smart Power Grid Telemetry & Automation &copy; 2026. NERC CIP Critical Infrastructure Protection.
    </footer>
</body>
</html>
