<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VortexEdge Controller{% endblock %} - SCADA Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="nav">
        <a href="/" class="brand">
            <span>⚡ VortexEdge SCADA Gateway</span>
        </a>
        <div class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Gateway Status</a>
            <a href="/telemetry" class="{% if request.path == '/telemetry' %}active{% endif %}">Sensor Telemetry</a>
            <a href="/settings/firmware" class="{% if request.path == '/settings/firmware' %}active{% endif %}">Firmware & OTA</a>
            <a href="/settings/network" class="{% if request.path == '/settings/network' %}active{% endif %}">Network Config</a>
            <a href="/settings/logs" class="{% if request.path == '/settings/logs' %}active{% endif %}">System Logs</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        VortexEdge Industrial Systems &copy; 2026. Substation Automation Standard IEC 61850.
    </footer>
</body>
</html>
