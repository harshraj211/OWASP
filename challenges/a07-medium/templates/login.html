{% extends "base.html" %}
{% block title %}Institutional Access Authentication{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <h1 style="font-size: 1.4rem; margin-bottom: 0.5rem; text-align: center;">Institutional Portal Login</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem;">
            Step 1: Enter your primary institutional credentials.
        </p>

        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">Institutional Operator ID</label>
                <input type="text" name="username" required placeholder="e.g. sysadmin_root" style="width: 100%; padding: 0.75rem; background: #06090f; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">Clearance Token</label>
                <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem; background: #06090f; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem;">
            </div>
            <button type="submit" class="btn btn-gold" style="width: 100%;">Verify Credentials &rarr;</button>
        </form>
    </div>
</div>
{% endblock %}
