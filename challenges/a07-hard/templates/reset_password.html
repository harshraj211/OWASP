{% extends "base.html" %}
{% block title %}Complete Biometric PIN Reset{% endblock %}
{% block content %}
<div style="max-width: 460px; margin: 3rem auto;">
    <div class="card">
        <h1 style="font-size: 1.4rem; margin-bottom: 0.5rem; text-align: center;">Enter Reset Token</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem;">
            Enter the reset token sent to the account holder and your new password.
        </p>

        {% if error %}
        <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid var(--danger); color: #fca5a5; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/reset-password">
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">Target Account Email</label>
                <input type="email" name="email" required placeholder="e.g. admin@apexbiologistics.net" style="width: 100%; padding: 0.75rem; background: #0b1120; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem;">
            </div>
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">Hex Token</label>
                <input type="text" name="token" required placeholder="e.g. 7f3a9b1c" style="width: 100%; padding: 0.75rem; background: #0b1120; border: 1px solid var(--border); border-radius: 6px; color: var(--teal); font-family: monospace; font-size: 0.95rem;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">New Biometric PIN</label>
                <input type="password" name="new_password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem; background: #0b1120; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem;">
            </div>
            <button type="submit" class="btn btn-teal" style="width: 100%;">Update Account Biometric PIN</button>
        </form>
    </div>
</div>
{% endblock %}
