{% extends "base.html" %}
{% block title %}Editorial Login{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <h1 style="font-size: 1.4rem; margin-bottom: 0.5rem; text-align: center;">Novus Editorial Suite</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem;">
            Authenticate with your editorial staff credentials.
        </p>

        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">Username</label>
                <input type="text" name="username" required placeholder="editor" style="width: 100%; padding: 0.75rem; background: #090d16; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">Password</label>
                <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem; background: #090d16; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem;">
            </div>
            <button type="submit" class="btn btn-purple" style="width: 100%;">Sign In to Console</button>
        </form>

        <div style="margin-top: 1.25rem; font-size: 0.75rem; color: var(--text-muted); text-align: center;">
            Default editorial credentials: <code>editor</code> / <code>EditorNovus2026!</code>
        </div>
    </div>
</div>
{% endblock %}
