<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AeroData Analytics{% endblock %} - AeroData Analytics</title>
    <style>
        :root {
            --bg-main: #0c0d10;
            --bg-surface: #14161b;
            --bg-card: #1c1f26;
            --border: #2a2e39;
            --accent: #00BFFF;
            --text-primary: #f0f2f5;
            --text-secondary: #9aa0ac;
            --text-muted: #646a78;
            --danger: #f87171;
            --success: #34d399;
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .site-header {
            height: 72px;
            padding: 0 clamp(1.5rem, 5vw, 4rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-primary); }

        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="password"], input[type="email"], select, textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--bg-surface) !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius);
            color: var(--text-primary) !important;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 1px var(--accent);
        }

        button, .btn {
            width: 100%;
            padding: 0.8rem 1.5rem;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        button:hover, .btn:hover { opacity: 0.9; }
        
        .btn-primary { background: var(--accent) !important; color: #111 !important; }

        .footer {
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-green { background: rgba(52, 211, 153, 0.1); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.2); }
        .badge-red { background: rgba(248, 113, 113, 0.1); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.2); }
        .badge-outline { border: 1px solid var(--border); color: var(--text-secondary); }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: var(--text-secondary); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">
            <img src="{{ url_for('static', filename='images/logo.webp') }}" alt="RedTeam Hacker Academy" style="height: 32px; border-radius: 4px;">
            <span>AeroData Analytics</span>
        </a>
        <div class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
            <a href="/about" class="{% if request.path == '/about' %}active{% endif %}">About Us</a>\n            <a href="/services" class="{% if request.path == '/services' %}active{% endif %}">Services</a>\n            <a href="/contact" class="{% if request.path == '/contact' %}active{% endif %}">Contact</a>\n            <a href="/datasets" class="{% if request.path == '/datasets' %}active{% endif %}">Telemetry Datasets</a>\n            <a href="/pipeline" class="{% if request.path == '/pipeline' %}active{% endif %}">Pipeline Studio</a>\n            <a href="/pipeline/import" class="{% if request.path == '/pipeline/import' %}active{% endif %}">Import Session</a>
            <span class="badge badge-outline">A08</span>
            {% if session.get('user') or session.get('username') %}
                <span class="badge badge-green">Authorized</span>
                <a href="/logout" style="color: var(--danger); font-size: 0.85rem; font-weight: 600;">Log Out</a>
            {% endif %}
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        AeroData Analytics Internal Systems &copy; 2026.
    </footer>
</body>
</html>
