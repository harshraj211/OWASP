<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AeroData Analytics{% endblock %} - Big Data Processing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <a href="/" class="brand">
            <span>📊 AeroData Distributed Analytics</span>
        </a>
        <nav class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Cluster Hub</a>
            <a href="/datasets" class="{% if request.path == '/datasets' %}active{% endif %}">Telemetry Datasets</a>
            <a href="/pipeline" class="{% if request.path == '/pipeline' %}active{% endif %}">Pipeline Studio</a>
            <a href="/pipeline/import" class="{% if request.path == '/pipeline/import' %}active{% endif %}">Import Session</a>
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        AeroData Cloud Processing Infrastructure &copy; 2026. High-Throughput Stream Pipeline.
    </footer>
</body>
</html>
