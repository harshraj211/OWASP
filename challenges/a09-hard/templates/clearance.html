{% extends "base.html" %}
{% block title %}Clearance Registration Desk{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="card">
        <h1 style="font-size: 1.4rem; margin-bottom: 0.5rem;">Defense Clearance Badge Enrollment</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">
            Enroll your badge credentials for tracking on the cryptographic audit ledger.
        </p>

        {% if message %}
        <div style="background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #6ee7b7; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem;">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST" action="/clearance">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">Operator Call-sign / Username</label>
                <input type="text" name="username" required placeholder="operator_guest" style="width: 100%; padding: 0.75rem; background: #080c14; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem;">
            </div>
            <button type="submit" class="btn btn-amber" style="width: 100%;">Enroll Badge Session</button>
        </form>
    </div>
</div>
{% endblock %}
