<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuantEdge Capital{% endblock %} - Algorithmic Portfolio Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="nav">
        <a href="/" class="brand">
            <img src="/static/images/logo.webp" alt="RedTeam Hacker Academy" class="logo-img" style="height: 32px; width: auto;" onerror="this.onerror=null; this.src='https://redteamacademy.com/wp-content/uploads/2026/03/RedTeam-Logo-White-min-300x90-1.webp';">
            <span>QuantEdge Capital Management</span>
        </a>
        <div class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Market Analytics</a>
            <a href="/portfolio" class="{% if request.path == '/portfolio' %}active{% endif %}">Portfolio Optimizer</a>
            <a href="/models" class="{% if request.path == '/models' %}active{% endif %}">Risk Models</a>
            <a href="/api-spec" class="{% if request.path == '/api-spec' %}active{% endif %}">Engine API Spec</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        QuantEdge Capital Analytics Engine &copy; 2026. High-Frequency Quantitative Risk Modeling.
    </footer>
</body>
</html>
