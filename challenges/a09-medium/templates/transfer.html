{% extends "base.html" %}
{% block title %}Initiate Wire Transfer{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <div class="card">
        <h1 style="font-size: 1.4rem; margin-bottom: 0.5rem;">Wire Transfer Request</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">
            Initiate a wire transfer. Every transaction memo is directly written to the compliance audit log.
        </p>

        {% if message %}
        <div style="background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #6ee7b7; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem;">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST" action="/transfer">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">Beneficiary Account</label>
                <input type="text" name="beneficiary" required value="US89APEX009218491823" style="width: 100%; padding: 0.7rem; background: #040811; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.85rem;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">Amount (USD)</label>
                <input type="number" name="amount" required value="5000" style="width: 100%; padding: 0.7rem; background: #040811; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.85rem;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem;">Remittance Advice / Memo (Logged to Audit Trail)</label>
                <textarea name="memo" rows="4" required placeholder="Enter invoice details or payment reference..." style="width: 100%; padding: 0.7rem; background: #040811; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-family: monospace; font-size: 0.85rem;"></textarea>
            </div>
            <button type="submit" class="btn btn-emerald" style="width: 100%;">Dispatch Wire Transfer</button>
        </form>
    </div>
</div>
{% endblock %}
